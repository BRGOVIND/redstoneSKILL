[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redstone-memory"
version = "0.1.0"
description = "Local-first persistent memory infrastructure for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Redstone contributors"}]
keywords = ["ai", "memory", "mcp", "obsidian", "sqlite"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
redstone = "redstone.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/redstone/skill/redstone-memory" = ["skill/redstone-memory/SKILL.md"]
"share/redstone/skill/redstone-memory/references" = ["skill/redstone-memory/references/policy.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
